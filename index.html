<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>piyo2026</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; color: #cfd6e6; font-family: system-ui, sans-serif; }
      #app { height: 100%; display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; }
      #stage canvas { display: block; width: 100% !important; height: 100% !important; }
      #hud { position: absolute; top: 8px; left: 8px; font-size: 12px; line-height: 1.5; pointer-events: none; text-shadow: 0 0 4px #000; }
      #controls { position: absolute; top: 8px; right: 8px; font-size: 12px; }
      #controls select { font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="hud"></div>
        <div id="controls">
          <label>AI <select id="ai-select"></select></label>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
