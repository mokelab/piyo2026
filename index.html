<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>piyo2026</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; color: #cfd6e6; font-family: system-ui, sans-serif; }
      #app { height: 100%; display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; container-type: size; }
      #stage canvas { display: block; width: 100% !important; height: 100% !important; }
      #hud { position: absolute; top: 8px; left: 8px; font-size: 12px; line-height: 1.5; white-space: pre; pointer-events: none; text-shadow: 0 0 4px #000; }
      #touch { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #touch[hidden] { display: none; }
      #controls { position: absolute; top: 8px; right: 8px; font-size: 12px; }
      #controls select { font-size: 12px; }
      #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8cqh; background: rgba(5, 6, 10, 0.7); }
      #title[hidden] { display: none; }
      #title h1 { margin: 0; font-size: 14cqw; letter-spacing: 0.04em; color: #fff; text-shadow: 0 0 2cqw #ffcc33; }
      #title button { font: inherit; font-size: 5cqw; padding: 1.5cqw 8cqw; color: #fff; background: transparent; border: 2px solid #cfd6e6; border-radius: 999px; cursor: pointer; }
      #title button:hover, #title button:focus-visible { background: #cfd6e6; color: #05060a; outline: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="touch" hidden></div>
        <div id="hud"></div>
        <div id="controls">
          <label>AI <select id="ai-select"></select></label>
        </div>
        <div id="title" hidden>
          <h1>Piyo 2026</h1>
          <button id="start-button" type="button">Start</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
